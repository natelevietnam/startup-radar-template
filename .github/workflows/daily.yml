name: Daily Startup Radar

on:
  schedule:
    # 11:00 UTC daily = 04:00 PT / 07:00 ET. Off-peak GitHub Actions
    # queue slot — scheduled jobs on forks at peak hours (15:00 UTC) are
    # often delayed by hours or skipped entirely.
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: startup_radar.db
          key: startup-radar-db-${{ github.run_id }}
          restore-keys: |
            startup-radar-db-

      - name: Write config
        # Store your config.yaml contents in a repo secret called CONFIG_YAML.
        # If you use Gmail / Google Sheets, also store CREDENTIALS_JSON and TOKEN_JSON.
        run: |
          echo "$CONFIG_YAML" > config.yaml
          if [ -n "$CREDENTIALS_JSON" ]; then echo "$CREDENTIALS_JSON" > credentials.json; fi
          if [ -n "$TOKEN_JSON" ]; then echo "$TOKEN_JSON" > token.json; fi
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}

      - name: Check config
        # The cloud config arrives through a secret, so nothing in a PR can keep
        # it in step with the local file. These two checks make the drift, and
        # the one dangerous misconfiguration, visible in the run log instead of
        # silent. Only a truncated hash is printed - never config contents,
        # because this repo is public and so are its workflow logs.
        run: |
          python3 - <<'CFGCHECK'
          import hashlib, sys, yaml
          raw = open("config.yaml", "rb").read()
          if not raw.strip():
              sys.exit("config.yaml is empty - is the CONFIG_YAML secret set?")
          print("config fingerprint:", hashlib.sha256(raw).hexdigest()[:16])
          cfg = yaml.safe_load(raw) or {}
          waas = ((cfg.get("sources") or {}).get("waas_messages") or {})
          if waas.get("enabled") is True:
              sys.exit("waas_messages is enabled in the cloud config. It must run "
                       "locally only - a cloud run marks the emails read and strands "
                       "the leads (MIGRATION_RUNBOOK.md section 1). Re-push the secret "
                       "with ./push_cloud_config.sh, which disables it for you.")
          CFGCHECK

      - name: Run pipeline
        run: python daily_run.py

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: startup-radar-db
          path: startup_radar.db
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 7
