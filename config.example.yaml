# Startup Radar — configuration
#
# Copy this file to `config.yaml` and edit.
# The interactive setup skill (run `claude` then `/setup`) will generate this for you.

user:
  name: "Your Name"
  # SEC EDGAR requires a real contact email in the User-Agent header.
  # Without one, the EDGAR source will be rate-limited / blocked (HTTP 403).
  email: "you@example.com"
  # Short background blurb — used by the DeepDive skill when tailoring fit rationales.
  # Example: "Software engineer, 6 years backend, looking for early-stage infra startups."
  background: "Describe yourself in one sentence."

# ---------------------------------------------------------------------------
# What you're looking for
# ---------------------------------------------------------------------------
targets:
  # Job titles you want to match (case-insensitive substring).
  # Replace these with whatever roles you're targeting — e.g. "software engineer",
  # "product manager", "founding engineer", "data scientist", "designer".
  roles:
    - software engineer
    - product manager
    - founding engineer
    - data scientist
    - designer

  # Titles to exclude. Remove these if you WANT senior roles,
  # or add "intern" / "junior" if you want to skip entry-level.
  seniority_exclusions:
    - intern
    - vp
    - director
    - head of
    # Keep this if `roles` above contains a bare title like "product manager".
    # Substring matching means "Founding Product Manager" satisfies "product
    # manager", so narrowing `roles` does NOT drop founding-PM postings on its
    # own - only an exclusion does. Matched on word boundaries, title only.
    - founding

  # Regex escape hatch for tiers a literal substring can't express — e.g.
  # "lead product manager" does not match "Lead Data Product Manager".
  # Matched case-insensitively against the role title. Leave empty to skip.
  title_exclusion_patterns: []
  #  - '\blead\b.*\bproduct\s+manage'      # Lead <anything> Product Manager
  #  - '\b(sr\.?|senior)\s+manager\b'      # manager-of-managers tier

  # Some feeds tag a seniority level alongside the title (NewPMJobs does).
  # Levels listed here are excluded even when the title looks in-band.
  level_exclusions: []
  #  - director
  #  - principal

  # How to treat listings that say "remote":
  #   "any" — accept them all (default)
  #   "us"  — accept only US-eligible remote roles. Job boards describe a role
  #           as "Remote" when it's remote *within Iberia* or *within Germany*;
  #           this drops those. Bare "Remote" with no country is still kept.
  # Postings demanding more than this many years of PRODUCT experience are out
  # of band. No feed supplies this figure — it lives only in the posting body —
  # so `enrich_experience.py` fetches and records it, and that script is the
  # enforcement point. Ingest cannot apply it: a JobMatch has no posting text.
  # Roughly a third of postings are readable; the rest keep NULL and are never
  # excluded, because an unread requirement is not an exceeded one.
  # Comment out to disable.
  # The top of your band, and a softer bar than the one below. A posting
  # between `soft` and `max` is marked Low priority with the figure shown and
  # stays on the board; only above `max` is it filed as Not Interested. Set
  # both to the same number for the old single-cut behaviour, or comment this
  # one out to disable the middle band.
  soft_years_experience: 5

  max_years_experience: 7

  # Drop postings that explicitly refuse visa sponsorship. Same shape as the
  # rule above: the statement lives only in the posting body, so
  # `enrich_sponsorship.py` fetches and records it and is the enforcement
  # point. ONLY an explicit refusal counts — "we are unable to sponsor", "must
  # be authorized to work in the US without sponsorship". Silence is not a
  # refusal, because most employers who do sponsor never mention it, so a
  # posting that said nothing (or could not be read) is always kept.
  # Set false, or comment out, to disable.
  require_visa_sponsorship: true

  remote_scope: any

  # Locations you're open to (case-insensitive substring).
  # Replace these with whatever cities/regions you care about.
  locations:
    - new york
    - nyc
    - san francisco
    - bay area
    - london
    - berlin
    - remote

  # Industry / product keywords — a company must match at least one.
  # Leave empty to include all industries.
  industries:
    - ai
    - artificial intelligence
    - machine learning
    - developer tools
    - saas

  # Optional: the same industries again, but RANKED most-wanted first.
  # `industries` above is a yes/no membership test; this one expresses
  # preference, and set_priorities.py uses it to let a top-ranked row clear the
  # High bar at a slightly lower fit score. Each entry is a group of substrings
  # matched against company name, description and role title; the first group
  # that matches wins. Omit the key entirely to rank every industry equally.
  industry_priority:
    - [ai, artificial intelligence, machine learning]
    - [developer tools, infrastructure]
    - [saas]

  # Minimum funding stage. Options: pre-seed, seed, series-a, series-b, series-c, any
  min_stage: series-a

  # Seed rounds at or above this amount (in millions USD) are also included.
  large_seed_threshold_musd: 50

# ---------------------------------------------------------------------------
# Forward-deployed lens (added 2026-10-01)
# ---------------------------------------------------------------------------
# A SECOND OPINION, NOT A GATE. `targets.*` above still decides what enters the
# board; everything here only ranks what is already on it, and writes
# job_matches.lens_tier / lens_score / lens_reasons. Nothing here can cut a row.
#
# The hypothesis, from a conversation with an operator in this niche: the roles
# that convert are the ones sitting between the customer and the engineering
# team at AI companies, and that family of work is sold under a dozen different
# titles. A keyword list beats a job-board search precisely because the title is
# unreliable — which is also why `description_signals` exists below, to catch a
# posting whose title hides what the job actually is.
#
# Deliberately NOT duplicated here, because `targets.*` already owns them and a
# second copy would drift: years of experience (soft 5 / max 7 above — the
# spec's 6 was rejected), locations, company exclusions, title and seniority
# exclusions, and visa stance. Visa in particular stays with
# enrich_sponsorship.py, whose classifier handles the cases a keyword list gets
# wrong — "visa sponsorship" is a substring of "no visa sponsorship".
job_matching:
  enabled: true

  title_tiers:
    # Tier 1 is the hypothesis, and these titles ARE admitted at ingest: a
    # title matching any of them passes the role gate the same way
    # `targets.roles` does. Without that, half of this list never reaches the
    # board at all — six of the twelve do not contain the literal string
    # "product manager", including "forward deployed PM" (just the
    # abbreviation) and "deployment strategist" (Palantir's original name for
    # the role), so the lens would have been scoring an empty set.
    #
    # Admitting these does NOT re-open the shapes the 2026-09-09 narrowing
    # dropped: every exclusion in `targets` still applies on top, so a
    # "Founding AI Product Manager" or a "Principal Solutions Product Manager"
    # is still cut.
    tier_1:
      - "forward deployed product manager"
      - "forward deployed pm"
      - "deployment strategist"
      - "agent operator"
      - "agent operations"
      - "ai strategist"
      - "applied ai product manager"
      - "ai product manager"
      - "strategic product manager"
      - "customer impact"
      - "solutions product manager"
      - "field product manager"

    # Tier 2 from the spec is deliberately omitted, not forgotten. It was
    # mostly engineer titles — solutions engineer, forward deployed engineer,
    # applied AI engineer — which `targets.seniority_exclusions` already blocks
    # ("software engineer", "founding engineer") and which the ingest role gate
    # would reject anyway. Admitting them would mean reversing both. Decided
    # 2026-10-01: skip entirely.

    # Tier 3 is foot-in-the-door work, and it is scored but NOT admitted at
    # ingest (decided 2026-10-01). These titles contain no PM string, so in
    # practice they do not reach the board today and this list is inert —
    # recorded so the taxonomy is complete and so turning it on is one flag
    # rather than a rewrite. When it is turned on, `tier_3_requires` below is
    # the condition: the company has to already be a strong, unblocked fit.
    tier_3:
      - "chief of staff"
      - "founder's associate"
      - "founders associate"
      - "business operations"
      - "strategy and operations"
      - "special projects"

    # Flip to true to admit tier-3 titles at ingest as well.
    tier_3_admitted_at_ingest: false

  # What "extremely strong company fit" means for tier 3, in the only terms the
  # repo can actually evaluate: the company's cached dossier. 75 is the same bar
  # as the auto-refresh threshold in generate_fit_artifact.py, and "ready" means
  # no unresolved sponsorship, comp or location gate. A company with no dossier
  # fails this on purpose — strength cannot be asserted about a company nobody
  # has researched.
  tier_3_requires:
    min_company_score: 75
    gate_status: "ready"

  # Points per tier. Tier 2 has no entry because it is not implemented.
  tier_points:
    tier_1: 40
    tier_3: 10

  # Description signals: how a mislabelled posting gets caught. Scored on the
  # posting body (job_matches.description_text), not the title.
  description_signals:
    strong:
      - "forward deployed"
      - "customer implementation"
      - "post-sales"
      - "evaluation period"
      - "proof of concept"
      - "land and expand"
      - "deployment"
      - "onboarding customers"
      - "solution design"
      - "enterprise customers"
      - "evals"
      - "eval harness"
      - "guardrails"
      - "agent"
      - "llm"
      - "rlhf"
    weak:
      - "playbook"
      - "stakeholder"
      - "discovery"
      - "roadmap"
    strong_points: 3
    strong_cap: 25
    weak_points: 1
    weak_cap: 5

  compensation:
    # The hard deal-breaker, unchanged. Currently also hardcoded as COMP_FLOOR
    # in generate_fit_artifact.py; that file should read this key instead, which
    # is a step-4 change rather than a config one.
    floor_usd: 150000
    # Above this, the posting is paying what the target band actually looks
    # like. Scored as a bonus — it is NOT a second deal-breaker. The spec
    # proposed 170000 as the floor; that was rejected on 2026-10-01 because
    # every dossier gate and the whole fit history is denominated at 150000.
    target_usd: 170000
    points_at_target: 10
    points_above_floor: 7
    points_if_unknown: 5      # most startups publish nothing; do not punish it
    points_below_floor: 0     # and say so in the reasons

  location_points:
    bay_area: 15
    remote_us: 10

  # Positive sponsorship signal only. A negative one never subtracts — an
  # explicit refusal is already a hard cut in enrich_sponsorship.py, so a row
  # that reaches scoring has not refused.
  visa_points_positive: 5

  recency:
    within_days: 14
    points: 5

  # Tier 1 + signals + location + comp + visa + recency tops out at 105, so the
  # total is clamped. Kept rather than rebalanced: the component weights come
  # from the spec and are easier to reason about than rescaled ones.
  score_cap: 100

  # Minimum score for a posting to appear in the daily digest.
  digest_min_score: 60

# ---------------------------------------------------------------------------
# Where to pull signal from
# ---------------------------------------------------------------------------
sources:
  rss:
    enabled: true
    feeds:
      - name: TechCrunch Venture
        url: https://techcrunch.com/category/venture/feed/
      - name: VentureBeat
        url: https://venturebeat.com/feed/
      - name: Crunchbase News
        url: https://news.crunchbase.com/feed/

  hackernews:
    enabled: true
    # Algolia HN search queries — one entry per query.
    queries:
      - "raised Series A"
      - "raised Series B"
      - "announces funding"
    lookback_hours: 48

  sec_edgar:
    enabled: true
    # SEC Form D filings — authoritative for US private raises. Free, no auth.
    # industry_sic_codes: narrow by SIC code; leave empty to include all.
    industry_sic_codes: []
    min_amount_musd: 5
    lookback_days: 7

  # Optional — requires Google OAuth. See setup skill.
  gmail:
    enabled: false
    label: "Startup Funding"
    # Senders to route to parsers. Add one per newsletter you subscribe to.
    senders: {}

  # Optional — ApplyFYI curated company collections -> startups watchlist.
  # No public API; the company list is parsed from the page's server-rendered
  # RSC payload. Company-level only (no individual roles). List filtered URLs.
  applyfyi:
    enabled: false
    urls:
      - "https://www.applyfyi.com/companies?fn=pm"

  # Optional — Work at a Startup (YC). AUTHENTICATED: needs your logged-in
  # session cookie (HTTP 406 otherwise). Set env WAAS_COOKIE or drop the raw
  # Cookie header into .secrets/waas_cookie.txt (gitignored). `query` is the
  # querystring from your filtered board URL (everything after `companies?`).
  # Cookies expire quickly — best run locally, not in the cloud cron.
  workatastartup:
    enabled: false
    query: "role=product&remote=yes&minExperience=3&sortBy=created_desc"
    product_only: true
    location_filter: false

  # Optional — WaaS inbound messages. YC companies that message you on Work at
  # a Startup (from workatastartup@ycombinator.com) become warm leads in the
  # Application Tracker ("In Progress" + the message logged as an activity).
  # Requires the same Google OAuth as gmail. No job digest exists, so this is
  # the useful WaaS email signal.
  waas_messages:
    enabled: false
    lookback_days: 90

# ---------------------------------------------------------------------------
# Where to write results
# ---------------------------------------------------------------------------
output:
  sqlite:
    enabled: true
    path: startup_radar.db

  # PM-Fit dashboard Artifact URL, minted the first time you publish it.
  # Account-specific — republishing from a different Claude account creates a
  # new URL. Set it here and nowhere else: generate_fit_artifact.py, app.py and
  # the startup-radar skill all read it from this key
  # (`python generate_fit_artifact.py --artifact-url`). Leave blank until you
  # have published once.
  fit_artifact_url: ""

  # Optional — requires Google OAuth.
  google_sheets:
    enabled: false
    sheet_id: ""

# ---------------------------------------------------------------------------
# LinkedIn connections (optional)
# ---------------------------------------------------------------------------
connections:
  enabled: false
  # Export from https://www.linkedin.com/mypreferences/d/download-my-data
  csv_path: ""

# ---------------------------------------------------------------------------
# DeepDive skill — fit scoring rubric
# ---------------------------------------------------------------------------
deepdive:
  # Weight each factor — higher = more important to you.
  fit_factors:
    industry_match: high
    funding_stage: high
    location: high
    role_fit_signals: high
    founder_pedigree: medium
    vc_tier: medium

  # VCs you'd consider "top tier" — used by DeepDive scoring.
  tier1_vcs:
    - a16z
    - Sequoia
    - Accel
    - Benchmark
    - Index
    - Founders Fund
    - Khosla
    - GV
    - Greylock
    - Coatue

  # Score thresholds
  thresholds:
    strong: 7.5
    moderate: 5.0
